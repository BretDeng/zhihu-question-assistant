<main><h1>让网页成为好问题的起点</h1><p>这是 UI 回归测试页面，不调用真实 API，也不会发布内容。右下角点击「问」查看全新的提问面板。</p><p>我们每天阅读许多内容，却不一定有时间思考其中的问题。浏览器插件可以帮助阅读、整理和建立联系。好的工具应该减少操作的负担，同时给人留下审核和判断的空间。它可以提供问题的草稿，但不应替我们决定问题的价值。我们仍需要结合自己的经验，判断问题的背景是否准确、话题是否适合，以及引用来源是否可靠。让自动化成为思考的起点，而不是思考的终点。</p></main>
