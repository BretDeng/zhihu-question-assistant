<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>知乎提问助手 · 模型</title><link rel="stylesheet" href="styles.css"></head>
<body>
<main class="app-shell">
  <header class="app-header"><div><p class="eyebrow">QUESTION LAB</p><h1>知乎提问助手</h1></div><button id="expandDashboardButton" class="header-tag" type="button">展开面板</button></header>
  <section class="active-card"><span class="qa-label">当前使用</span><h2 id="activeName">尚未配置模型</h2><p id="activeDetail">添加你的 API，开始把网页变成好问题。</p></section>
  <section class="format-card" aria-labelledby="formatHeading">
    <div class="section-heading"><h2 id="formatHeading">问题描述形式</h2><span class="site-badge">生成偏好</span></div>
    <div class="format-switch" role="group" aria-label="问题描述形式">
      <button id="summaryModeButton" type="button" aria-pressed="true" disabled>概括提问</button>
      <button id="originalModeButton" type="button" aria-pressed="false" disabled>网页原文</button>
    </div>
    <p id="descriptionModeHint" class="site-help">标题 + 材料概括与讨论问题。</p>
    <p id="descriptionModeStatus" class="settings-status" role="status" aria-live="polite"></p>
  </section>
  <div class="section-heading"><h2>我的模型 <span id="profileCount">0</span></h2><button id="addProfileButton" class="qa-secondary" type="button">添加配置</button></div>
  <input id="profileSearch" class="search-input" type="search" placeholder="搜索名称、供应商或模型…" aria-label="搜索模型配置">
  <div id="profileList" class="profile-list" aria-label="保存的模型配置"></div>
  <section id="profileEditor" class="editor-card is-hidden" aria-label="编辑模型配置">
    <div class="section-heading"><h2 id="editorTitle">添加模型配置</h2><button id="cancelEditButton" class="qa-quiet" type="button">取消</button></div>
    <form id="profileForm">
      <label class="field"><span>配置名称</span><input id="nameInput" maxlength="60" placeholder="例如：日常写作 / 知乎直答"></label>
      <label class="field"><span>提供方</span><select id="providerInput"><option value="openai">OpenAI 兼容 API</option><option value="zhida">知乎直答</option></select></label>
      <label class="field" id="baseUrlField"><span>API 地址</span><input id="baseUrlInput" type="url" placeholder="https://api.openai.com/v1" autocomplete="off"></label>
      <label class="field"><span>模型名称</span><input id="modelInput" list="modelOptions" placeholder="gpt-4o-mini" autocomplete="off"><datalist id="modelOptions"></datalist><small id="modelHint"></small></label>
      <label class="field"><span>API Key / Access Secret</span><input id="apiKeyInput" type="password" placeholder="输入密钥" autocomplete="off" spellcheck="false"><small id="keyHint">密钥仅用于你选择的 API，不交给网页。</small></label>
      <label class="remember-option"><input id="rememberKeyInput" type="checkbox" checked><span>在这台设备上记住密钥</span></label>
      <p class="security-notice">保存在扩展本机存储，不同步云端；不是系统钥匙串。取消勾选后密钥仅保留到浏览器会话结束。</p>
      <button id="saveSettingsButton" class="qa-primary save-button" type="submit">保存并使用</button>
    </form>
  </section>
  <p id="settingsStatus" class="settings-status" role="status" aria-live="polite"></p>
  <section class="site-card" aria-labelledby="siteHeading">
    <div class="section-heading"><h2 id="siteHeading">网站过滤</h2><span class="site-badge">免打扰</span></div>
    <p class="site-help">不想在某些网站看到「问」？将它们加入排除列表，悬浮按钮和提问面板就不会出现。</p>
    <form id="siteForm">
      <label class="field" for="excludedSitesInput"><span>不启用插件的网站</span><textarea id="excludedSitesInput" rows="4" maxlength="52000" placeholder="example.com&#10;https://news.example.org/article" spellcheck="false" disabled></textarea><small>每行一个域名或网址，自动包含子域名。比如 example.com 也会排除 news.example.com；填写 www.example.com 则仅排除该域名及其下级子域名。不支持通配符。</small></label>
      <button id="saveSitesButton" class="qa-secondary" type="submit" disabled>保存网站过滤</button>
      <p id="siteStatus" class="settings-status" role="status" aria-live="polite"></p>
    </form>
  </section>
  <footer>打开网页右下角的「问」，即可分析内容与生成提问。</footer>
</main>
<script src="uiTheme.js"></script><script type="module" src="popup.js"></script>
</body></html>
